<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title>Font Size Tweak interface mockup</title>
  <desc>Stylised window mockup with sliders and preview text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e5e7eb" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
  </defs>
  <rect width="640" height="400" rx="32" fill="url(#bg)" />
  <g transform="translate(40 40)">
    <rect width="560" height="320" rx="24" fill="url(#panel)" stroke="#cbd5f5" stroke-width="2" />
    <rect x="24" y="24" width="512" height="48" rx="12" fill="#1e293b" opacity="0.85" />
    <circle cx="56" cy="48" r="8" fill="#f87171" />
    <circle cx="88" cy="48" r="8" fill="#facc15" />
    <circle cx="120" cy="48" r="8" fill="#34d399" />
    <text x="160" y="54" font-family="Segoe UI, sans-serif" font-size="20" fill="#f8fafc">Font Size Tweak</text>
    <g transform="translate(40 104)">
      <rect width="200" height="24" rx="12" fill="#1e3a8a" opacity="0.12" />
      <rect width="140" height="24" rx="12" fill="#2563eb" />
      <circle cx="140" cy="12" r="12" fill="#1e3a8a" />
      <text x="0" y="52" font-family="Segoe UI, sans-serif" font-size="16" fill="#1f2937">Title bar font size</text>
    </g>
    <g transform="translate(40 176)">
      <rect width="200" height="24" rx="12" fill="#0f172a" opacity="0.12" />
      <rect width="100" height="24" rx="12" fill="#0ea5e9" />
      <circle cx="100" cy="12" r="12" fill="#0369a1" />
      <text x="0" y="52" font-family="Segoe UI, sans-serif" font-size="16" fill="#1f2937">Menu font size</text>
    </g>
    <g transform="translate(40 248)">
      <rect width="200" height="24" rx="12" fill="#0f172a" opacity="0.12" />
      <rect width="170" height="24" rx="12" fill="#22c55e" />
      <circle cx="170" cy="12" r="12" fill="#047857" />
      <text x="0" y="52" font-family="Segoe UI, sans-serif" font-size="16" fill="#1f2937">Message box font size</text>
    </g>
    <g transform="translate(320 112)">
      <rect width="216" height="180" rx="16" fill="#f1f5f9" stroke="#cbd5f5" />
      <text x="24" y="60" font-family="Segoe UI, sans-serif" font-size="28" font-weight="600" fill="#0f172a">Aa</text>
      <text x="24" y="100" font-family="Segoe UI, sans-serif" font-size="16" fill="#1f2937">Title bar — 12 pt</text>
      <text x="24" y="130" font-family="Segoe UI, sans-serif" font-size="16" fill="#1f2937">Menus — 11 pt</text>
      <text x="24" y="160" font-family="Segoe UI, sans-serif" font-size="16" fill="#1f2937">Message box — 12 pt</text>
    </g>
  </g>
</svg>
